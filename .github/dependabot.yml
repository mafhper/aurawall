version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 5
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    # TypeScript 7 blocked: typescript-eslint@8.x peer range is ">=4.8.4 <6.1.0".
    # Remove once typescript-eslint ships TS 7 support.
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    cooldown:
      default-days: 5
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
